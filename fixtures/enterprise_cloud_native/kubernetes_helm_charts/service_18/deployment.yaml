# Kubernetes Microservice Deployment Manifest 18
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-service-18
  labels:
    app: enterprise-service-18
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: enterprise-service-18
  template:
    metadata:
      labels:
        app: enterprise-service-18
    spec:
      containers:
      - name: enterprise-service-18
        image: navigator/enterprise-service-18:2.4.0
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-service-18-svc
spec:
  selector:
    app: enterprise-service-18
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
