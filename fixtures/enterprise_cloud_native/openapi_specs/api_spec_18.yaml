# OpenAPI 3.1.0 Enterprise Specification for API Gateway Route 18
openapi: 3.1.0
info:
  title: Enterprise Microservice API 18
  version: 2.5.0
  description: High-throughput enterprise REST interface for service domain 18
paths:
  /api/v1/domain-18/resources:
    get:
      summary: List all resources in domain 18
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Successful query response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResourceItem18"
    post:
      summary: Create resource in domain 18
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceItem18"
      responses:
        "201":
          description: Resource created successfully
components:
  schemas:
    ResourceItem18:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        score:
          type: number
        isActive:
          type: boolean
