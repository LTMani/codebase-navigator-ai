syntax = "proto3";

package com.navigator.grpc.service1;

option go_package = "github.com/navigator/grpc/service1";
option java_package = "com.navigator.grpc.service1";

message ServiceRequest1 {
  string request_id = 1;
  string tenant_id = 2;
  int64 timestamp = 3;
  map<string, string> metadata = 4;
}

message ServiceResponse1 {
  string request_id = 1;
  bool is_success = 2;
  int32 error_code = 3;
  string message = 4;
  double execution_latency_ms = 5;
}

service EnterpriseRpcService1 {
  rpc ProcessRequest(ServiceRequest1) returns (ServiceResponse1);
  rpc StreamRequests(stream ServiceRequest1) returns (stream ServiceResponse1);
}
