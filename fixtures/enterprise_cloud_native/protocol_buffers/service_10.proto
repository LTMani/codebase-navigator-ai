syntax = "proto3";

package com.navigator.grpc.service10;

option go_package = "github.com/navigator/grpc/service10";
option java_package = "com.navigator.grpc.service10";

message ServiceRequest10 {
  string request_id = 1;
  string tenant_id = 2;
  int64 timestamp = 3;
  map<string, string> metadata = 4;
}

message ServiceResponse10 {
  string request_id = 1;
  bool is_success = 2;
  int32 error_code = 3;
  string message = 4;
  double execution_latency_ms = 5;
}

service EnterpriseRpcService10 {
  rpc ProcessRequest(ServiceRequest10) returns (ServiceResponse10);
  rpc StreamRequests(stream ServiceRequest10) returns (stream ServiceResponse10);
}
