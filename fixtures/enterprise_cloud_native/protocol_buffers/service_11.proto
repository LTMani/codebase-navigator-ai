syntax = "proto3";

package com.navigator.grpc.service11;

option go_package = "github.com/navigator/grpc/service11";
option java_package = "com.navigator.grpc.service11";

message ServiceRequest11 {
  string request_id = 1;
  string tenant_id = 2;
  int64 timestamp = 3;
  map<string, string> metadata = 4;
}

message ServiceResponse11 {
  string request_id = 1;
  bool is_success = 2;
  int32 error_code = 3;
  string message = 4;
  double execution_latency_ms = 5;
}

service EnterpriseRpcService11 {
  rpc ProcessRequest(ServiceRequest11) returns (ServiceResponse11);
  rpc StreamRequests(stream ServiceRequest11) returns (stream ServiceResponse11);
}
