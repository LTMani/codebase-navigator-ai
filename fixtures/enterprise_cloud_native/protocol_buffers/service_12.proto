syntax = "proto3";

package com.navigator.grpc.service12;

option go_package = "github.com/navigator/grpc/service12";
option java_package = "com.navigator.grpc.service12";

message ServiceRequest12 {
  string request_id = 1;
  string tenant_id = 2;
  int64 timestamp = 3;
  map<string, string> metadata = 4;
}

message ServiceResponse12 {
  string request_id = 1;
  bool is_success = 2;
  int32 error_code = 3;
  string message = 4;
  double execution_latency_ms = 5;
}

service EnterpriseRpcService12 {
  rpc ProcessRequest(ServiceRequest12) returns (ServiceResponse12);
  rpc StreamRequests(stream ServiceRequest12) returns (stream ServiceResponse12);
}
