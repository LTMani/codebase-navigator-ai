syntax = "proto3";

package com.navigator.grpc.service14;

option go_package = "github.com/navigator/grpc/service14";
option java_package = "com.navigator.grpc.service14";

message ServiceRequest14 {
  string request_id = 1;
  string tenant_id = 2;
  int64 timestamp = 3;
  map<string, string> metadata = 4;
}

message ServiceResponse14 {
  string request_id = 1;
  bool is_success = 2;
  int32 error_code = 3;
  string message = 4;
  double execution_latency_ms = 5;
}

service EnterpriseRpcService14 {
  rpc ProcessRequest(ServiceRequest14) returns (ServiceResponse14);
  rpc StreamRequests(stream ServiceRequest14) returns (stream ServiceResponse14);
}
