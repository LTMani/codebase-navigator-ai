syntax = "proto3";

package com.navigator.grpc.service15;

option go_package = "github.com/navigator/grpc/service15";
option java_package = "com.navigator.grpc.service15";

message ServiceRequest15 {
  string request_id = 1;
  string tenant_id = 2;
  int64 timestamp = 3;
  map<string, string> metadata = 4;
}

message ServiceResponse15 {
  string request_id = 1;
  bool is_success = 2;
  int32 error_code = 3;
  string message = 4;
  double execution_latency_ms = 5;
}

service EnterpriseRpcService15 {
  rpc ProcessRequest(ServiceRequest15) returns (ServiceResponse15);
  rpc StreamRequests(stream ServiceRequest15) returns (stream ServiceResponse15);
}
