syntax = "proto3";

package com.navigator.grpc.service16;

option go_package = "github.com/navigator/grpc/service16";
option java_package = "com.navigator.grpc.service16";

message ServiceRequest16 {
  string request_id = 1;
  string tenant_id = 2;
  int64 timestamp = 3;
  map<string, string> metadata = 4;
}

message ServiceResponse16 {
  string request_id = 1;
  bool is_success = 2;
  int32 error_code = 3;
  string message = 4;
  double execution_latency_ms = 5;
}

service EnterpriseRpcService16 {
  rpc ProcessRequest(ServiceRequest16) returns (ServiceResponse16);
  rpc StreamRequests(stream ServiceRequest16) returns (stream ServiceResponse16);
}
