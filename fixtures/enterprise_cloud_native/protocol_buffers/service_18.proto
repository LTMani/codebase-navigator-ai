syntax = "proto3";

package com.navigator.grpc.service18;

option go_package = "github.com/navigator/grpc/service18";
option java_package = "com.navigator.grpc.service18";

message ServiceRequest18 {
  string request_id = 1;
  string tenant_id = 2;
  int64 timestamp = 3;
  map<string, string> metadata = 4;
}

message ServiceResponse18 {
  string request_id = 1;
  bool is_success = 2;
  int32 error_code = 3;
  string message = 4;
  double execution_latency_ms = 5;
}

service EnterpriseRpcService18 {
  rpc ProcessRequest(ServiceRequest18) returns (ServiceResponse18);
  rpc StreamRequests(stream ServiceRequest18) returns (stream ServiceResponse18);
}
