syntax = "proto3";

package com.navigator.grpc.service2;

option go_package = "github.com/navigator/grpc/service2";
option java_package = "com.navigator.grpc.service2";

message ServiceRequest2 {
  string request_id = 1;
  string tenant_id = 2;
  int64 timestamp = 3;
  map<string, string> metadata = 4;
}

message ServiceResponse2 {
  string request_id = 1;
  bool is_success = 2;
  int32 error_code = 3;
  string message = 4;
  double execution_latency_ms = 5;
}

service EnterpriseRpcService2 {
  rpc ProcessRequest(ServiceRequest2) returns (ServiceResponse2);
  rpc StreamRequests(stream ServiceRequest2) returns (stream ServiceResponse2);
}
