syntax = "proto3";

package com.navigator.grpc.service20;

option go_package = "github.com/navigator/grpc/service20";
option java_package = "com.navigator.grpc.service20";

message ServiceRequest20 {
  string request_id = 1;
  string tenant_id = 2;
  int64 timestamp = 3;
  map<string, string> metadata = 4;
}

message ServiceResponse20 {
  string request_id = 1;
  bool is_success = 2;
  int32 error_code = 3;
  string message = 4;
  double execution_latency_ms = 5;
}

service EnterpriseRpcService20 {
  rpc ProcessRequest(ServiceRequest20) returns (ServiceResponse20);
  rpc StreamRequests(stream ServiceRequest20) returns (stream ServiceResponse20);
}
