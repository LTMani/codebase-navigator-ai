syntax = "proto3";

package com.navigator.grpc.service21;

option go_package = "github.com/navigator/grpc/service21";
option java_package = "com.navigator.grpc.service21";

message ServiceRequest21 {
  string request_id = 1;
  string tenant_id = 2;
  int64 timestamp = 3;
  map<string, string> metadata = 4;
}

message ServiceResponse21 {
  string request_id = 1;
  bool is_success = 2;
  int32 error_code = 3;
  string message = 4;
  double execution_latency_ms = 5;
}

service EnterpriseRpcService21 {
  rpc ProcessRequest(ServiceRequest21) returns (ServiceResponse21);
  rpc StreamRequests(stream ServiceRequest21) returns (stream ServiceResponse21);
}
