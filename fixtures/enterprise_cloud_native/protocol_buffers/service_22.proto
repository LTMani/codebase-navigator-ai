syntax = "proto3";

package com.navigator.grpc.service22;

option go_package = "github.com/navigator/grpc/service22";
option java_package = "com.navigator.grpc.service22";

message ServiceRequest22 {
  string request_id = 1;
  string tenant_id = 2;
  int64 timestamp = 3;
  map<string, string> metadata = 4;
}

message ServiceResponse22 {
  string request_id = 1;
  bool is_success = 2;
  int32 error_code = 3;
  string message = 4;
  double execution_latency_ms = 5;
}

service EnterpriseRpcService22 {
  rpc ProcessRequest(ServiceRequest22) returns (ServiceResponse22);
  rpc StreamRequests(stream ServiceRequest22) returns (stream ServiceResponse22);
}
