syntax = "proto3";

package com.navigator.grpc.service23;

option go_package = "github.com/navigator/grpc/service23";
option java_package = "com.navigator.grpc.service23";

message ServiceRequest23 {
  string request_id = 1;
  string tenant_id = 2;
  int64 timestamp = 3;
  map<string, string> metadata = 4;
}

message ServiceResponse23 {
  string request_id = 1;
  bool is_success = 2;
  int32 error_code = 3;
  string message = 4;
  double execution_latency_ms = 5;
}

service EnterpriseRpcService23 {
  rpc ProcessRequest(ServiceRequest23) returns (ServiceResponse23);
  rpc StreamRequests(stream ServiceRequest23) returns (stream ServiceResponse23);
}
