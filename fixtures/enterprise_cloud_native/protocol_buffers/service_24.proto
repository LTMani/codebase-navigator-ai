syntax = "proto3";

package com.navigator.grpc.service24;

option go_package = "github.com/navigator/grpc/service24";
option java_package = "com.navigator.grpc.service24";

message ServiceRequest24 {
  string request_id = 1;
  string tenant_id = 2;
  int64 timestamp = 3;
  map<string, string> metadata = 4;
}

message ServiceResponse24 {
  string request_id = 1;
  bool is_success = 2;
  int32 error_code = 3;
  string message = 4;
  double execution_latency_ms = 5;
}

service EnterpriseRpcService24 {
  rpc ProcessRequest(ServiceRequest24) returns (ServiceResponse24);
  rpc StreamRequests(stream ServiceRequest24) returns (stream ServiceResponse24);
}
