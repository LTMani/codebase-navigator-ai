syntax = "proto3";

package com.navigator.grpc.service25;

option go_package = "github.com/navigator/grpc/service25";
option java_package = "com.navigator.grpc.service25";

message ServiceRequest25 {
  string request_id = 1;
  string tenant_id = 2;
  int64 timestamp = 3;
  map<string, string> metadata = 4;
}

message ServiceResponse25 {
  string request_id = 1;
  bool is_success = 2;
  int32 error_code = 3;
  string message = 4;
  double execution_latency_ms = 5;
}

service EnterpriseRpcService25 {
  rpc ProcessRequest(ServiceRequest25) returns (ServiceResponse25);
  rpc StreamRequests(stream ServiceRequest25) returns (stream ServiceResponse25);
}
