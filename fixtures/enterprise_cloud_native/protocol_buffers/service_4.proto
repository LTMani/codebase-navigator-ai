syntax = "proto3";

package com.navigator.grpc.service4;

option go_package = "github.com/navigator/grpc/service4";
option java_package = "com.navigator.grpc.service4";

message ServiceRequest4 {
  string request_id = 1;
  string tenant_id = 2;
  int64 timestamp = 3;
  map<string, string> metadata = 4;
}

message ServiceResponse4 {
  string request_id = 1;
  bool is_success = 2;
  int32 error_code = 3;
  string message = 4;
  double execution_latency_ms = 5;
}

service EnterpriseRpcService4 {
  rpc ProcessRequest(ServiceRequest4) returns (ServiceResponse4);
  rpc StreamRequests(stream ServiceRequest4) returns (stream ServiceResponse4);
}
