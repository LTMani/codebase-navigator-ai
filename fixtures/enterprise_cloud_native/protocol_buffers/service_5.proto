syntax = "proto3";

package com.navigator.grpc.service5;

option go_package = "github.com/navigator/grpc/service5";
option java_package = "com.navigator.grpc.service5";

message ServiceRequest5 {
  string request_id = 1;
  string tenant_id = 2;
  int64 timestamp = 3;
  map<string, string> metadata = 4;
}

message ServiceResponse5 {
  string request_id = 1;
  bool is_success = 2;
  int32 error_code = 3;
  string message = 4;
  double execution_latency_ms = 5;
}

service EnterpriseRpcService5 {
  rpc ProcessRequest(ServiceRequest5) returns (ServiceResponse5);
  rpc StreamRequests(stream ServiceRequest5) returns (stream ServiceResponse5);
}
