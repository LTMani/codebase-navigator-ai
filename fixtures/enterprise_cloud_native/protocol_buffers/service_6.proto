syntax = "proto3";

package com.navigator.grpc.service6;

option go_package = "github.com/navigator/grpc/service6";
option java_package = "com.navigator.grpc.service6";

message ServiceRequest6 {
  string request_id = 1;
  string tenant_id = 2;
  int64 timestamp = 3;
  map<string, string> metadata = 4;
}

message ServiceResponse6 {
  string request_id = 1;
  bool is_success = 2;
  int32 error_code = 3;
  string message = 4;
  double execution_latency_ms = 5;
}

service EnterpriseRpcService6 {
  rpc ProcessRequest(ServiceRequest6) returns (ServiceResponse6);
  rpc StreamRequests(stream ServiceRequest6) returns (stream ServiceResponse6);
}
