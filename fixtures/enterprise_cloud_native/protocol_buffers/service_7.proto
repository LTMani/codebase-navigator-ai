syntax = "proto3";

package com.navigator.grpc.service7;

option go_package = "github.com/navigator/grpc/service7";
option java_package = "com.navigator.grpc.service7";

message ServiceRequest7 {
  string request_id = 1;
  string tenant_id = 2;
  int64 timestamp = 3;
  map<string, string> metadata = 4;
}

message ServiceResponse7 {
  string request_id = 1;
  bool is_success = 2;
  int32 error_code = 3;
  string message = 4;
  double execution_latency_ms = 5;
}

service EnterpriseRpcService7 {
  rpc ProcessRequest(ServiceRequest7) returns (ServiceResponse7);
  rpc StreamRequests(stream ServiceRequest7) returns (stream ServiceResponse7);
}
