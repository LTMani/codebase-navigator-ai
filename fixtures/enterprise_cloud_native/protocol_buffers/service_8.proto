syntax = "proto3";

package com.navigator.grpc.service8;

option go_package = "github.com/navigator/grpc/service8";
option java_package = "com.navigator.grpc.service8";

message ServiceRequest8 {
  string request_id = 1;
  string tenant_id = 2;
  int64 timestamp = 3;
  map<string, string> metadata = 4;
}

message ServiceResponse8 {
  string request_id = 1;
  bool is_success = 2;
  int32 error_code = 3;
  string message = 4;
  double execution_latency_ms = 5;
}

service EnterpriseRpcService8 {
  rpc ProcessRequest(ServiceRequest8) returns (ServiceResponse8);
  rpc StreamRequests(stream ServiceRequest8) returns (stream ServiceResponse8);
}
