syntax = "proto3";

package com.navigator.grpc.service9;

option go_package = "github.com/navigator/grpc/service9";
option java_package = "com.navigator.grpc.service9";

message ServiceRequest9 {
  string request_id = 1;
  string tenant_id = 2;
  int64 timestamp = 3;
  map<string, string> metadata = 4;
}

message ServiceResponse9 {
  string request_id = 1;
  bool is_success = 2;
  int32 error_code = 3;
  string message = 4;
  double execution_latency_ms = 5;
}

service EnterpriseRpcService9 {
  rpc ProcessRequest(ServiceRequest9) returns (ServiceResponse9);
  rpc StreamRequests(stream ServiceRequest9) returns (stream ServiceResponse9);
}
