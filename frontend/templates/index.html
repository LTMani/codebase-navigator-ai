<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeBase Navigator AI - Understand Any Codebase</title>
    <meta name="description" content="AI-powered platform for analyzing, understanding, and navigating unfamiliar software codebases.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/views.css">
    <link rel="stylesheet" href="/static/css/graph.css">
    <link rel="stylesheet" href="/static/css/code-viewer.css">
    <link rel="stylesheet" href="/static/css/animations.css">
</head>
<body>
    <div id="app-container">
        <!-- Sidebar Navigation -->
        <aside id="app-sidebar">
            <div class="sidebar-header flex items-center justify-between" style="padding: 16px 20px; border-bottom: 1px solid var(--border-color);">
                <a href="#/dashboard" class="flex items-center gap-2">
                    <div style="width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, #3b82f6, #06b6d4); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; color: #fff;">
                        CN
                    </div>
                    <div class="sidebar-brand-text flex flex-col">
                        <span style="font-weight: 700; font-size: 14px; letter-spacing: -0.02em;">CodeBase Navigator</span>
                        <span style="font-size: 10px; color: var(--accent-cyan); font-weight: 600; text-transform: uppercase;">AI Code Intelligence</span>
                    </div>
                </a>
            </div>

            <!-- Project Selector Dropdown -->
            <div id="project-selector-container" style="padding: 12px 16px; border-bottom: 1px solid var(--border-subtle);">
                <!-- Dynamic Project Selector populated by JS -->
            </div>

            <!-- Navigation Links -->
            <nav class="sidebar-nav flex-1" style="overflow-y: auto; padding: 12px 8px;">
                <div id="sidebar-nav-links" class="flex flex-col gap-1">
                    <!-- Dynamic Nav Items -->
                </div>
            </nav>

            <!-- User Status & Footer -->
            <div id="sidebar-user-footer" style="padding: 14px 16px; border-top: 1px solid var(--border-color);" class="flex items-center justify-between">
                <!-- User Profile & Signout -->
            </div>
        </aside>

        <!-- Main Workspace Viewport -->
        <div id="app-main">
            <!-- Header Bar -->
            <header id="app-header">
                <div class="flex items-center gap-4">
                    <button id="btn-toggle-sidebar" class="btn btn-outline btn-sm" title="Toggle Sidebar (Ctrl+B)">
                        ☰
                    </button>
                    <div id="header-breadcrumbs" class="flex items-center gap-2 text-sm text-secondary">
                        <span>Projects</span>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <button id="btn-quick-search" class="btn btn-secondary btn-sm flex items-center gap-2" style="min-width: 200px; justify-content: space-between;">
                        <span class="text-muted">Search symbols, files...</span>
                        <kbd style="background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; font-size: 10px;">Ctrl+K</kbd>
                    </button>
                    <div id="header-status-badge"></div>
                    <div id="header-user-menu"></div>
                </div>
            </header>

            <!-- Active View Container -->
            <main id="view-container">
                <!-- Dynamic View Render Target -->
            </main>
        </div>
    </div>

    <!-- Command Palette Search Modal -->
    <div id="command-palette-modal" class="modal-overlay">
        <div class="modal-box" style="max-width: 640px; padding: 0; overflow: hidden;">
            <div style="padding: 16px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 12px;">
                <span style="font-size: 16px; color: var(--accent-primary);">🔍</span>
                <input id="command-palette-input" class="w-full font-mono text-sm" placeholder="Type a file path, symbol, function, or command..." autocomplete="off" />
                <kbd style="font-size: 10px; color: var(--text-muted); padding: 2px 6px; border: 1px solid var(--border-color); border-radius: 4px;">ESC</kbd>
            </div>
            <div id="command-palette-results" style="max-height: 360px; overflow-y: auto; padding: 8px;">
                <!-- Search Hits -->
            </div>
        </div>
    </div>

    <!-- Universal Detail Slide-Out Drawer -->
    <div id="detail-drawer" class="modal-overlay" style="justify-content: flex-end;">
        <div id="detail-drawer-content" class="modal-box" style="width: 480px; height: 100vh; max-height: 100vh; border-radius: 0; border-right: none; padding: 24px;">
            <!-- Dynamic Drawer Details -->
        </div>
    </div>

    <!-- Toasts Notifications Container -->
    <div id="toast-container"></div>

    <!-- ES6 Application Entry Point -->
    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
