[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-navigator-ai"
version = "1.0.0"
description = "An AI-powered platform for analyzing, understanding, and navigating unfamiliar software codebases"
authors = [{ name = "CodeBase Navigator AI Contributors" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.1.0",
    "Flask-SQLAlchemy>=3.1.0",
    "Flask-Cors>=6.0.0",
    "SQLAlchemy>=2.0.0",
    "Werkzeug>=3.1.0",
    "PyJWT>=2.8.0",
    "Pygments>=2.17.0",
    "Jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
